<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - Panadería El Vacán</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" media="print" onload="this.media='all'">
    <noscript>
        <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    </noscript>
    <link rel="stylesheet" href="css/style.css">
    <script>
        (function () {
            try {
                var t = localStorage.getItem('panaderia-tema');
                if (t !== 'claro' && t !== 'oscuro') {
                    t = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro';
                }
                document.documentElement.setAttribute('data-theme', t);
            } catch (e) {}
        })();
    </script>
    <script type="module" src="js/auth.js"></script>
</head>
<body class="login-page">
    <div class="auth-loader"><div class="spinner"></div></div>

    <button type="button" class="theme-toggle theme-toggle--float" aria-label="Cambiar de tema" title="Cambiar de tema"><span class="toggle-icon" aria-hidden="true">🌙</span></button>

    <main class="login-main">
        <div class="login-card glass">
            <img src="img/icono.jpg" class="login-logo" alt="Logo de Panadería El Vacán">
            <h1>Panadería El Vacán</h1>
            <p class="login-sub">Inicia sesión para acceder al sistema</p>

            <form id="formLogin" novalidate>
                <div class="form-group">
                    <label for="loginEmail">Correo electrónico</label>
                    <input type="email" id="loginEmail" placeholder="Ej. steven_admin@correo.com" autocomplete="email" required>
                </div>

                <div class="form-group">
                    <label for="loginClave">Contraseña</label>
                    <input type="password" id="loginClave" placeholder="••••••••" autocomplete="current-password" required>
                </div>

                <div id="loginError" class="login-error" hidden></div>

                <button type="submit" class="btn-primary btn-lg">Entrar</button>
            </form>
        </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script type="module" src="js/login.js"></script>
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function () {
                navigator.serviceWorker.register('sw.js').catch(function () {});
            });
        }
    </script>
</body>
</html>
