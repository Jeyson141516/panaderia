<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería - Registro de Ventas</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script type="module" src="js/auth.js"></script>
</head>
<body>
    <div class="auth-loader"><div class="spinner"></div></div>

    <nav>
        <div class="brand">
            <span class="logo">🥖</span>
            <h2>Panadería Familiar<small>Gestión de ventas</small></h2>
        </div>
        <ul>
            <li><a href="index.html" class="active"><span class="nav-icon">💰</span> Ventas</a></li>
            <li><a href="inventario.html"><span class="nav-icon">📦</span> Inventario y Gastos</a></li>
            <li><a href="personal.html"><span class="nav-icon">👥</span> Personal y Adelantos</a></li>
            <li><a href="reportes.html"><span class="nav-icon">📊</span> Reportes</a></li>
            <li><a href="limpiar-db.html" class="danger-link"><span class="nav-icon">🗑️</span> Limpiar BD</a></li>
        </ul>
        <div class="nav-footer">
            <span class="nav-user">👤 <span id="navUsuario">…</span></span>
            <button id="btnLogout" class="btn-logout">⏻ Cerrar sesión</button>
        </div>
    </nav>

    <main>
        <header>
            <h1>Registrar Venta de Pan</h1>
            <p>Cada funda cuesta $1.00</p>
        </header>

        <section class="card">
            <form id="formVenta">
                <div class="form-group search-wrap">
                    <label for="clienteBusqueda">Cliente</label>
                    <div class="search-row">
                        <input type="text" id="clienteBusqueda" placeholder="Buscar cliente por nombre..." autocomplete="off">
                        <button type="button" id="btnAbrirModal" class="btn-secondary">+ Nuevo</button>
                    </div>
                    <ul id="listaSugerencias" class="suggestion-list"></ul>
                </div>

                <div class="form-group">
                    <label for="cantidad">Cantidad de Fundas</label>
                    <input type="number" id="cantidad" min="1" value="1" required>
                </div>

                <div class="form-group">
                    <label for="estadoPago">Estado de la Venta</label>
                    <select id="estadoPago">
                        <option value="pagado">Pagado (Contado)</option>
                        <option value="debe">Quedó Debiendo (Fiado)</option>
                    </select>
                </div>

                <div class="total-box">
                    <h3>Total a Pagar: $<span id="totalPagar">1.00</span></h3>
                </div>

                <button type="submit" class="btn-primary">Registrar Venta</button>
            </form>
        </section>
    </main>

    <div id="modalCliente" class="modal">
        <div class="modal-card">
            <h3>Registrar Nuevo Cliente</h3>
            <div class="form-group">
                <label for="nuevoNombre">Nombre y Apellido</label>
                <input type="text" id="nuevoNombre" placeholder="Ej. Juan Pérez">
            </div>
            <div class="form-group">
                <label for="nuevoTelefono">Teléfono (Opcional)</label>
                <input type="text" id="nuevoTelefono" placeholder="Ej. 0991234567">
            </div>
            <div class="modal-actions">
                <button type="button" id="guardarClienteModal" class="btn-success">Guardar</button>
                <button type="button" id="cerrarModal" class="btn-danger">Cancelar</button>
            </div>
        </div>
    </div>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script type="module" src="js/ventas.js"></script>
</body>
</html>
