<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panadería - Inventario y Gastos</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
    <script src="js/auth.js"></script>
</head>
<body>
    <nav>
        <div class="brand">
            <span class="logo">🥖</span>
            <h2>Panadería Familiar<small>Gestión de ventas</small></h2>
        </div>
        <ul>
            <li><a href="index.html"><span class="nav-icon">💰</span> Ventas</a></li>
            <li><a href="inventario.html" class="active"><span class="nav-icon">📦</span> Inventario y Gastos</a></li>
            <li><a href="personal.html"><span class="nav-icon">👥</span> Personal y Adelantos</a></li>
            <li><a href="reportes.html"><span class="nav-icon">📊</span> Reportes</a></li>
            <li><a href="limpiar-db.html" class="danger-link"><span class="nav-icon">🗑️</span> Limpiar BD</a></li>
        </ul>
        <div class="nav-footer">
            <span class="nav-user">👤 <span id="navUsuario">steven_admin</span></span>
            <button id="btnLogout" class="btn-logout">⏻ Cerrar sesión</button>
        </div>
    </nav>

    <main>
        <header>
            <h1>Control de Gastos por Inventario</h1>
            <p>Registra los insumos y gastos de producción de la panadería.</p>
        </header>

        <div class="card">
            <h3>Registrar Gasto / Insumo</h3>
            <form id="formGasto">
                <div class="form-group">
                    <label for="descripcion">Insumo o Gasto (Ej. Harina, Manteca, Leña)</label>
                    <input type="text" id="descripcion" required placeholder="Nombre del insumo">
                </div>

                <div class="form-group">
                    <label for="monto">Costo / Gasto ($)</label>
                    <input type="number" step="0.01" min="0.01" id="monto" required placeholder="0.00">
                </div>

                <button type="submit" class="btn-primary">Registrar Gasto de Inventario</button>
            </form>
        </div>
    </main>

    <div id="toastContainer" class="toast-container" aria-live="polite"></div>

    <script type="module" src="js/inventario.js"></script>
</body>
</html>
