<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reporte de Ventas y Finanzas — Panadería Familiar</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        :root {
            --tinta: #000000;
            --muted: #3f3f46;
            --suave: #6b6b6b;
            --borde: #d0d0d0;
            --cabecera-tabla: #e8eaed;
        }

        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #e9ecef;
            color: var(--tinta);
            -webkit-font-smoothing: antialiased;
        }

        /* Barra de acciones (se oculta al imprimir) */
        .acciones {
            position: sticky;
            top: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            padding: 12px;
            background: #ffffff;
            border-bottom: 1px solid #d4d7da;
            box-shadow: 0 1px 4px rgba(0, 0, 0, .08);
        }

        .acciones button {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 9px 16px;
            border-radius: 8px;
            border: 1px solid #d4d7da;
            background: #ffffff;
            color: var(--tinta);
            cursor: pointer;
            transition: background .15s ease, box-shadow .15s ease;
        }

        .acciones button:hover {
            background: #f3f4f6;
            box-shadow: 0 1px 3px rgba(0, 0, 0, .1);
        }

        .acciones button.primario {
            background: #111111;
            border-color: #111111;
            color: #fff;
        }

        .acciones button.primario:hover { background: #000; }
        .acciones button:disabled { opacity: .55; cursor: not-allowed; }

        /* Estado de error / sin datos */
        .aviso {
            max-width: 560px;
            margin: 60px auto;
            background: #fff;
            border: 1px solid var(--borde);
            border-radius: 12px;
            padding: 28px;
            text-align: center;
        }

        .aviso.oculto { display: none; }
        .aviso h2 { font-size: 1.05rem; margin-bottom: 8px; }
        .aviso p { font-size: 0.9rem; color: var(--muted); margin-bottom: 16px; }
        .aviso button.primario {
            font-family: inherit;
            font-size: 0.9rem;
            font-weight: 600;
            padding: 9px 18px;
            border-radius: 8px;
            border: none;
            background: #111111;
            color: #fff;
            cursor: pointer;
        }

        /* Hoja A4 (vista en pantalla) */
        .documento {
            background: #ffffff;
            width: 210mm;
            max-width: 100%;
            margin: 24px auto;
            padding: 14mm 16mm;
            border: 1px solid #c9cdd1;
            box-shadow: 0 6px 24px rgba(0, 0, 0, .12);
            font-size: 10pt;
            line-height: 1.45;
            color: #000;
        }

        .documento.oculto { display: none; }

        /* Cabecera corporativa */
        .membrete {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 16px;
            padding-bottom: 8px;
            border-bottom: 2.5px solid #000;
        }

        .membrete .negocio {
            font-size: 17pt;
            font-weight: 700;
            color: #000;
            letter-spacing: .01em;
        }

        .membrete .subtitulo {
            font-size: 8.5pt;
            color: var(--suave);
            margin-top: 3px;
        }

        .membrete .titulo-doc {
            font-size: 15pt;
            font-weight: 700;
            text-align: right;
            color: #000;
            line-height: 1.2;
        }

        /* Metadatos compactos */
        .meta {
            display: flex;
            justify-content: space-between;
            align-items: baseline;
            flex-wrap: wrap;
            gap: 4px 16px;
            font-size: 8.5pt;
            color: var(--muted);
            padding: 7px 0 2px;
        }

        .meta b { font-weight: 600; color: #000; }
        .meta .fecha { margin-left: auto; white-space: nowrap; }

        /* Títulos de sección (estilo FPDF) */
        .seccion {
            font-size: 9pt;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: .06em;
            color: #000;
            margin: 13px 0 0;
            padding-bottom: 2px;
            border-bottom: 1px solid #000;
        }

        /* Tablas contables */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 4px;
            font-size: 9pt;
        }

        th, td { padding: 3.5px 6px; }

        th {
            background: var(--cabecera-tabla);
            font-size: 7.5pt;
            text-transform: uppercase;
            letter-spacing: .05em;
            color: #000;
            text-align: left;
            border-top: 1px solid #000;
            border-bottom: 1px solid #000;
        }

        td { border-bottom: 1px solid var(--borde); color: #000; }

        th.num, td.num {
            text-align: right;
            font-variant-numeric: tabular-nums;
        }

        .fila-total td {
            border-top: 1.2px solid #000;
            border-bottom: 1.2px solid #000;
            font-weight: 700;
            background: #fafbfc;
        }

        .sin-datos { text-align: center; color: var(--suave); }

        .nota {
            font-size: 8pt;
            color: var(--muted);
            margin-top: 5px;
            line-height: 1.5;
        }

        .nota b { color: #000; }

        /* Pie */
        .pie {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 4px 16px;
            margin-top: 14px;
            padding-top: 5px;
            border-top: 1.5px solid #000;
            font-size: 8pt;
            color: #000;
        }

        @media print {
            * { color: #000 !important; box-shadow: none !important; text-shadow: none !important; }

            body { background: #fff !important; }

            .acciones,
            .aviso { display: none !important; }

            .documento {
                width: auto;
                max-width: 100%;
                margin: 0;
                padding: 0;
                border: none;
                box-shadow: none;
                font-size: 10pt;
            }

            .membrete { border-bottom: 2px solid #000; }
            .seccion { margin-top: 12pt; }

            th { background: #e8eaed !important; }

            .seccion { break-after: avoid; }
            table { page-break-inside: auto; }
            tr { break-inside: avoid; page-break-inside: avoid; }
            thead { display: table-header-group; }
        }

        @page {
            size: A4;
            margin: 12mm;
        }
    </style>
</head>
<body>
    <div class="acciones">
        <button id="btnVolver" title="Volver a Reportes">⬅ Volver</button>
        <button id="btnImprimir" title="Abre el diálogo de impresión del navegador">🖨️ Imprimir</button>
        <button id="btnDescargar" class="primario" title="Descarga directa del PDF (vectorial, sin diálogo de impresión)">📥 Descargar PDF</button>
    </div>

    <div id="estadoMensaje" class="aviso oculto">
        <h2>No hay reporte disponible</h2>
        <p>Genera primero el reporte en la sección Reportes para poder exportarlo o imprimirlo.</p>
        <button id="btnIrReportes" class="primario">Ir a Reportes</button>
    </div>

    <div id="reporteDocumento" class="documento"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" defer></script>
    <script type="module" src="js/reporte-impresion.js"></script>
</body>
</html>
